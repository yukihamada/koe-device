<!doctype html><html lang="ja"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Koe — 声でつなぐ / Sound That Connects</title>
<meta name="description" content="名前を入れるだけ。リンクを送って、ひらいたら声でつながる。Koe の声でつなぐ。Sound That Connects.">
<meta property="og:title" content="Koe — 声でつなぐ">
<meta property="og:description" content="名前を入れるだけ。声でつながる。Sound That Connects.">
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{--bg:#0a0a0a;--ink:#e8e8e8;--mut:#8a8a93;--koe:#8B5CF6;--koe2:#a78bfa;--card:rgba(255,255,255,.03);--line:rgba(255,255,255,.09)}
html{scroll-behavior:smooth}
body{background:var(--bg);color:var(--ink);font-family:'Inter','Hiragino Sans',-apple-system,sans-serif;min-height:100dvh;line-height:1.7;
 background:radial-gradient(60% 45% at 50% 0%,rgba(139,92,246,.16),transparent 70%),var(--bg)}
a{color:inherit;text-decoration:none}
nav{display:flex;justify-content:space-between;align-items:center;padding:16px 22px;border-bottom:1px solid var(--line)}
nav .b{font-weight:800;letter-spacing:.18em;font-size:15px}
nav .b b{color:var(--koe2)}
nav a.x{font-size:12px;color:var(--mut);letter-spacing:.1em}
.wrap{max-width:520px;margin:0 auto;padding:52px 22px 80px}
.kick{font-size:11px;letter-spacing:.4em;color:var(--koe2);text-transform:uppercase;text-align:center}
h1{font-size:34px;font-weight:800;text-align:center;margin:14px 0 6px;letter-spacing:.01em}
.sub{color:var(--mut);font-size:14px;text-align:center;margin-bottom:30px}
.sub b{color:var(--ink)}
label{display:block;font-size:12px;letter-spacing:.06em;color:var(--mut);margin:18px 0 7px}
input{width:100%;background:#141417;border:1px solid var(--line);border-radius:12px;padding:15px 16px;color:var(--ink);font-size:17px}
input:focus{outline:none;border-color:var(--koe)}
.btn{display:block;width:100%;margin-top:16px;background:var(--koe);color:#fff;border:0;border-radius:12px;padding:16px;font-size:17px;font-weight:800;cursor:pointer;text-align:center;box-shadow:0 8px 30px rgba(139,92,246,.32)}
.btn.s{background:transparent;color:var(--koe2);border:1px solid rgba(139,92,246,.4);box-shadow:none}
.panel{display:none;margin-top:24px;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:20px}
.panel.show{display:block}
.lk{background:#111;border:1px solid var(--line);border-radius:10px;padding:12px 14px;font-size:13px;color:var(--koe2);word-break:break-all;margin:8px 0 4px}
.share{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.share a,.share button{flex:1;min-width:84px;text-align:center;background:#161619;border:1px solid var(--line);border-radius:9px;padding:11px 8px;color:var(--ink);font-size:13px;cursor:pointer;font-family:inherit}
.status{margin-top:16px;text-align:center;font-size:15px;color:var(--mut)}
.status.on{color:#a78bfa;font-weight:700}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:#666;margin-right:7px}
.status.on .dot{background:#8B5CF6;box-shadow:0 0 0 0 rgba(139,92,246,.7);animation:p 1.6s infinite}
@keyframes p{70%{box-shadow:0 0 0 9px rgba(139,92,246,0)}}
.hint{font-size:12px;color:var(--mut);text-align:center;margin-top:24px;line-height:1.9}
.hint a{color:var(--koe2)}
</style></head><body>
<nav><a class="b" href="/">━◯━ <b>Koe</b></a><a class="x" href="/">Sound That Connects ↩</a></nav>
<div class="wrap">
  <div class="kick">Koe · 声でつなぐ</div>
  <h1>声でつなぐ。</h1>
  <div class="sub">名前を入れるだけ。<b>リンクを送って、ひらいたら声でつながる。</b><br>Koe の思想そのまま — Sound That Connects.</div>
  <label>だれとつなぐ？</label>
  <input id="name" placeholder="例：けんたろう" maxlength="40" autocomplete="off">
  <button class="btn" id="make">つなぐリンクを作る</button>

  <div class="panel" id="panel">
    <div style="font-size:13px;color:var(--mut)"><b id="who"></b> とつなぐ部屋ができました。</div>
    <div class="lk" id="link"></div>
    <div class="share">
      <button id="sh">📣 共有</button>
      <a id="line" target="_blank" rel="noopener">LINE</a>
      <a id="sms">SMS</a>
      <a id="mail">メール</a>
      <button id="cp">コピー</button>
    </div>
    <label style="margin-top:18px">どこでも貼れる（Claude Code / Slack / メモ）</label>
    <div class="lk" id="prompt"></div>
    <button class="btn s" id="cpp" style="margin-top:8px">このプロンプトをコピー</button>
    <a class="btn" id="enter" target="_blank" style="margin-top:14px">▶ 自分が今すぐ入る</a>
    <div class="status" id="status"><span class="dot"></span>あなたを待っています…</div>
  </div>
  <div class="hint">声・顔・画面共有・チャット対応（最大6人）。<br>同じリンクを開いた人が自動でつながります。<a href="/">← Koe トップへ</a></div>
</div>
<script>
// 声の実体は稼働中の room インフラ（yukihamada.jp）を再利用。Koe はその入口（声でつなぐ）。
var BASE='https://yukihamada.jp';
var $=function(s){return document.getElementById(s)};
function rid(){var c='abcdefghijkmnpqrstuvwxyz23456789',o='';for(var i=0;i<8;i++)o+=c[Math.floor(Math.random()*c.length)];return o;}
var room='',shortUrl='',prompt='',poll=null;
function mk(){
  var nm=$('name').value.trim()||'相手';
  var h=nm.toLowerCase().replace(/[^a-z0-9-]/g,''); if(!h)h='koe-'+rid();
  room=h; shortUrl=BASE+'/k/'+h; prompt='!open '+shortUrl;
  $('who').textContent=nm;
  $('link').textContent=shortUrl;
  $('prompt').textContent=prompt;
  $('enter').href=BASE+'/room/'+room;
  var msg='声でつなぎたい。これ開いて → '+shortUrl;
  $('line').href='https://line.me/R/share?text='+encodeURIComponent(msg);
  $('sms').href='sms:?&body='+encodeURIComponent(msg);
  $('mail').href='mailto:?subject='+encodeURIComponent('声でつなぎたい')+'&body='+encodeURIComponent(msg);
  $('sh').onclick=function(){if(navigator.share){navigator.share({title:'声でつなぐ',text:msg,url:shortUrl}).catch(function(){});}else{cp();}};
  $('cp').onclick=cp; $('cpp').onclick=cpp;
  $('panel').classList.add('show');
  if(poll)clearInterval(poll); poll=setInterval(checkp,4000); checkp();
}
function cp(){navigator.clipboard&&navigator.clipboard.writeText(shortUrl).then(function(){$('cp').textContent='コピー済 ✓';setTimeout(function(){$('cp').textContent='コピー';},1500);});}
function cpp(){navigator.clipboard&&navigator.clipboard.writeText(prompt).then(function(){$('cpp').textContent='コピー済 ✓';setTimeout(function(){$('cpp').textContent='このプロンプトをコピー';},1500);});}
function checkp(){fetch(BASE+'/api/room/'+room+'/presence',{cache:'no-store'}).then(function(r){return r.json();}).then(function(d){
  var n=d.count||0,s=$('status');
  if(n>=2){s.className='status on';s.innerHTML='<span class=dot></span>🎉 つながりました（'+n+'人）';}
  else if(n===1){s.className='status on';s.innerHTML='<span class=dot></span>あなたが入室中 — 相手のひらきを待っています';}
  else{s.className='status';s.innerHTML='<span class=dot></span>リンクを送って、ふたりで開いてください';}
}).catch(function(){});}
$('make').onclick=mk;
$('name').addEventListener('keydown',function(e){if(e.key==='Enter')mk();});
</script></body></html>

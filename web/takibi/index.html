<!doctype html><html lang=ja><head><meta charset=utf-8>
<meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name=robots content="noindex">
<meta name=theme-color content="#0a0a0a">
<meta name=apple-mobile-web-app-capable content=yes>
<meta name=mobile-web-app-capable content=yes>
<meta name=apple-mobile-web-app-status-bar-style content=black-translucent>
<meta name=apple-mobile-web-app-title content="焚き火">
<link rel=manifest href="https://mcp.koe.live/takibi/manifest.webmanifest">
<link rel=icon href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Ctext x='32' y='46' font-size='40' text-anchor='middle'%3E%F0%9F%94%A5%3C/text%3E%3C/svg%3E">
<link rel=apple-touch-icon href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 180 180'%3E%3Crect width='180' height='180' fill='%230a0a0a'/%3E%3Ctext x='90' y='126' font-size='104' text-anchor='middle'%3E%F0%9F%94%A5%3C/text%3E%3C/svg%3E">
<title>焚き火 — 声でくべる・声で聴く</title>
<style>
:root{color-scheme:dark}
*{box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,'Hiragino Sans',sans-serif;background:#0a0a0a;color:#f5f5f0;margin:0 auto;padding:20px 16px 56px;max-width:560px;line-height:1.7}
h1{font-size:20px;font-weight:600;margin:0 0 4px}
h2{font-size:15px;font-weight:600;margin:0}
a{color:#e6c449}
input,textarea{width:100%;padding:11px 12px;font-size:16px;background:#111;color:#f5f5f0;border:1px solid #2a2a2a;border-radius:10px;margin:5px 0}
input[type=checkbox]{width:auto;margin:0 6px 0 0;vertical-align:middle;accent-color:#e6c449}
textarea{resize:vertical}
button{font-size:15px;padding:10px 18px;border-radius:99px;border:1px solid #333;background:#161616;color:#f5f5f0;cursor:pointer}
button.primary{background:#e6c449;color:#0a0a0a;font-weight:700;border:none}
button:disabled{opacity:.5}
.card{background:#101010;border:1px solid #1f1f1f;border-radius:16px;padding:18px;margin:14px 0}
.sub{opacity:.6;font-size:13px;margin:0 0 18px}
.tx{text-align:left;background:#111;border:1px solid #222;border-radius:10px;padding:13px 15px;font-size:13px;line-height:1.9;opacity:.85;margin:14px 0}
#recBtn.rec-on{background:#c0392b;border-color:#c0392b;color:#fff}
#timer{margin-left:10px;opacity:.7;font-variant-numeric:tabular-nums}
audio{width:100%;margin:10px 0}
label.opt{display:block;font-size:13px;opacity:.85;margin:8px 0}
#status{font-size:13px;min-height:1.2em}
#inbox{list-style:none;padding:0;margin:10px 0 0}
.msg{border:1px solid #1f1f1f;border-radius:12px;padding:12px;margin:8px 0}
.msg.unread{border-color:#e6c449}
.msg .meta{display:flex;justify-content:space-between;gap:8px;font-size:12px;opacity:.8}
.msg .tx{margin:8px 0}
.empty{opacity:.5;font-size:13px;text-align:center;padding:12px 0}

body{max-width:520px;text-align:center}
header{display:flex;align-items:center;gap:8px;justify-content:center;margin:2px 0 8px}
#fire{position:relative;width:140px;height:140px;margin:18px auto 6px;border-radius:50%;display:grid;place-items:center;
 background:radial-gradient(circle at 50% 60%,#3a1a00,#0a0a0a 70%);transition:box-shadow .8s ease}
#fire .emoji{font-size:62px;line-height:1;filter:drop-shadow(0 0 14px #e6770088);animation:flick 2.2s ease-in-out infinite}
@keyframes flick{0%,100%{transform:translateY(0) scale(1)}50%{transform:translateY(-2px) scale(1.06)}}
#recBtn{width:100%;max-width:340px;margin:8px auto 2px;padding:16px;font-size:17px;font-weight:700}
#recBtn.rec-on{background:#c0392b;border-color:#c0392b;color:#fff}
#timer{display:block;margin:6px 0;opacity:.6;font-variant-numeric:tabular-nums}
#status{min-height:1.3em;font-size:13px;opacity:.9}
#feed{list-style:none;padding:0;margin:14px 0 0;text-align:left}
.log{border:1px solid #1f1f1f;border-radius:14px;padding:13px 15px;margin:9px 0;background:#0e0e0e}
.log .meta{display:flex;justify-content:space-between;gap:8px;font-size:12px;opacity:.7;margin-bottom:6px}
.log .tx{font-size:14px;line-height:1.8;margin:0 0 8px}
.play{padding:6px 16px;font-size:13px}
.fc{float:right;opacity:.7;font-size:13px;cursor:pointer;user-select:none}
.linkbtn{background:none;border:none;color:#e6c449;padding:6px 8px;font-size:13px}
#radioBtn{font-size:13px;padding:7px 16px;margin:4px auto 0;display:inline-flex;gap:6px;align-items:center}
#radioBtn.primary{box-shadow:0 0 14px #e6770066}
#langToggle{position:absolute;top:12px;right:14px;font-size:11px;padding:4px 11px;border-radius:99px;border:1px solid #2a2a2a;background:#161616;color:#f5f5f0;cursor:pointer}
.signin{border-top:1px solid #1f1f1f;margin-top:14px;padding-top:14px}
select{width:100%;padding:11px 12px;font-size:16px;background:#111;color:#f5f5f0;border:1px solid #2a2a2a;border-radius:10px;margin:5px 0}
</style></head>
<body>
<button id=langToggle aria-label="Switch language"></button>
<div id=fire><span class=emoji aria-hidden=true>🔥</span></div>
<header><h1 style="margin:0" data-i18n=h>焚き火</h1></header>
<p class=sub style="margin:0 0 4px"><span data-i18n=sub>声でくべる・声で聴く</span> <span id=flame style="opacity:.6"></span></p>
<div style="text-align:center"><button id=radioBtn data-i18n=radio_off>🔊 自動で読む</button></div>

<section class=card id=postCard hidden>
 <button id=recBtn data-i18n=rec_btn>● 押して話す</button>
 <span id=timer>0:00</span>
 <audio id=preview controls hidden></audio>
 <div id=confirm hidden style="display:flex;gap:8px;margin-top:8px">
  <button id=burnBtn class=primary style="flex:1" data-i18n=confirm_burn>🔥 これをくべる</button>
  <button id=redoBtn class=linkbtn style="flex:0 0 auto" data-i18n=redo>やり直す</button>
 </div>
 <p id=status></p>
</section>

<section class=card id=signinCard hidden>
 <p class=sub style="margin:0 0 8px" data-i18n=signin_msg>声でくべるにはサインインが必要です。</p>
 <input id=email type=email placeholder="you@example.com" autocomplete=email aria-label=email>
 <button id=sendLink class=primary style="width:100%" data-i18n=send_link>ログインリンクを送る</button>
 <p id=signinStatus class=sub style="margin:8px 0 0"></p>
</section>

<h2 data-i18n=feed_h style="margin-top:6px">🪵 いまの薪</h2>
<p class=sub style="margin:2px 0 0;font-size:12px" data-i18n=feed_hint>長押しで🔥／自動更新中</p>
<ul id=feed></ul>

<section class=card id=reserveCard>
 <h2><span data-i18n=res_h>🔥 実機を予約</span> <span id=resCount class=sub style="font-weight:400"></span></h2>
 <p class=sub style="margin:4px 0 10px" data-i18n=res_sub>約10時間駆動・ソーラー充電対応。手のひらの焚き火デバイス。先行予約（無料・キャンセル可）。</p>
 <select id=resVariant aria-label=variant>
  <option value=any data-i18n-opt=res_any>どちらでも / 未定</option>
  <option value=wifi data-i18n-opt=res_wifi>WiFi版（自宅・拠点向け・最安）</option>
  <option value=lte data-i18n-opt=res_lte>どこでもLTE版（設定不要・屋外）</option>
 </select>
 <input id=resEmail type=email placeholder="you@example.com" autocomplete=email aria-label=email>
 <button id=resBtn class=primary style="width:100%;margin-top:6px" data-i18n=res_btn>予約する（無料）</button>
 <p id=resStatus class=sub style="margin:8px 0 0"></p>
</section>
<p class=sub style="text-align:center;margin-top:20px;border-top:1px solid #1f1f1f;padding-top:14px">
 <span data-i18n=footer>ホーム画面に追加すると、焚き火デバイスとして使えます。</span><br>
 <a href="https://github.com/yukihamada/koe-device" target=_blank rel=noopener data-i18n=oss>⚙ オープンソース（ハード/ファーム・GitHub）</a> ·
 <a href="#" id=logout hidden data-i18n=logout>サインアウト</a>
</p>
<script>

const API='https://mcp.koe.live';const $=id=>document.getElementById(id);
const escq=s=>(s||'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
// fallback i18n for pages that don't define their own T() (e.g. /v/ listen page stays ja)
if(typeof T==='undefined'){var T=function(k){return({rec_btn:'● 録音',rec_redo:'● 録り直す',rec_stop:'■ 停止',mic_fail:'マイクを使えません: '}[k])||''}}
let rec=null,recChunks=[],recBlob=null,timerIv=null,t0=0;
function pickMime(){for(const m of['audio/webm;codecs=opus','audio/webm','audio/mp4'])if(window.MediaRecorder&&MediaRecorder.isTypeSupported(m))return m;return''}
function stopTimer(){clearInterval(timerIv)}
function startTimer(){t0=Date.now();timerIv=setInterval(()=>{const s=Math.floor((Date.now()-t0)/1000);$('timer').textContent=Math.floor(s/60)+':'+String(s%60).padStart(2,'0');if(s>=300&&rec&&rec.state==='recording')rec.stop()},250)}
async function toggleRec(){
 if(rec&&rec.state==='recording'){rec.stop();return}
 try{
  const stream=await navigator.mediaDevices.getUserMedia({audio:true});
  const m=pickMime();rec=new MediaRecorder(stream,m?{mimeType:m}:undefined);
  recChunks=[];recBlob=null;$('preview').hidden=true;
  rec.ondataavailable=e=>{if(e.data.size)recChunks.push(e.data)};
  rec.onstop=()=>{recBlob=new Blob(recChunks,{type:rec.mimeType||'audio/webm'});$('preview').src=URL.createObjectURL(recBlob);$('preview').hidden=false;stream.getTracks().forEach(t=>t.stop());stopTimer();$('recBtn').textContent=T('rec_redo');$('recBtn').classList.remove('rec-on')};
  rec.start();startTimer();$('recBtn').textContent=T('rec_stop');$('recBtn').classList.add('rec-on');
 }catch(e){$('status').textContent=T('mic_fail')+e.message}
}
async function blobB64(b){const u=new Uint8Array(await b.arrayBuffer());let s='';for(let i=0;i<u.length;i+=32768)s+=String.fromCharCode.apply(null,u.subarray(i,i+32768));return btoa(s)}

const I18N={
 ja:{h:"焚き火",sub:"声でくべる・声で聴く",rec_btn:"● 押して話す",rec_stop:"■ 止める",
  confirm_burn:"🔥 これをくべる",redo:"やり直す",review:"▲ 聞き返してOKなら「くべる」",
  feed_h:"🪵 いまの薪",signin_msg:"声でくべるにはサインインが必要です。",send_link:"ログインリンクを送る",
  footer:"ホーム画面に追加すると、焚き火デバイスとして使えます。",logout:"サインアウト",
  res_h:"🔥 実機を予約",res_sub:"約10時間駆動・ソーラー充電対応。手のひらの焚き火デバイス。先行予約（無料・キャンセル可）。",
  res_any:"どちらでも / 未定",res_wifi:"WiFi版（自宅・拠点向け・最安）",res_lte:"どこでもLTE版（設定不要・屋外）",
  res_btn:"予約する（無料）",res_bademail:"メールアドレスを確認してください",res_sending:"予約中…",res_ok:"✅ 予約しました。準備できたらこのメールにお知らせします",res_n:"人が予約",
  radio_off:"🔊 自動で読む",radio_on:"🔊 自動で読む：ON",feed_hint:"長押しで🔥／自動更新中",oss:"⚙ オープンソース（ハード/ファーム・GitHub）",
  mic_fail:"マイクを使えません: ",empty:"まだ薪がありません",unreach:"焚き火に届きません: ",
  listen:"▶ 聞く",converting:"声に変換中…",playing:"🔊 再生中",play_fail:"再生失敗: ",
  burning:"くべています…",burned:"🔥 くべました: ",fail:"失敗: ",too_short:"録音が短すぎます",
  link_sending:"送信中…",link_sent:"✅ メールのリンクを開くと、ここに戻ってくべられます",locale:"ja-JP"},
 en:{h:"Campfire",sub:"add your voice · listen back",rec_btn:"● Hold to speak",rec_stop:"■ Stop",
  confirm_burn:"🔥 Add this",redo:"Redo",review:"▲ Listen back, then “Add this”",
  feed_h:"🪵 Logs on the fire",signin_msg:"Sign in to add a log with your voice.",send_link:"Send login link",
  footer:"Add to your home screen to use it as a campfire device.",logout:"Sign out",
  res_h:"🔥 Reserve the device",res_sub:"~10h battery, solar-rechargeable. A campfire device in your palm. Pre-order (free, cancellable).",
  res_any:"Either / undecided",res_wifi:"WiFi (home/base, cheapest)",res_lte:"Anywhere-LTE (no setup, outdoors)",
  res_btn:"Reserve (free)",res_bademail:"Check your email address",res_sending:"Reserving…",res_ok:"✅ Reserved. We'll email you when it's ready",res_n:" reserved",
  radio_off:"🔊 Auto-read",radio_on:"🔊 Auto-read: ON",feed_hint:"long-press for 🔥 · auto-refreshing",oss:"⚙ Open source (hardware/firmware · GitHub)",
  mic_fail:"Can't use the mic: ",empty:"No logs yet",unreach:"Can't reach the campfire: ",
  listen:"▶ Listen",converting:"Converting to voice…",playing:"🔊 Playing",play_fail:"Playback failed: ",
  burning:"Adding…",burned:"🔥 Added: ",fail:"Failed: ",too_short:"Recording too short",
  link_sending:"Sending…",link_sent:"✅ Open the link in your email and you'll come back here ready to post",locale:"en-US"}
};
let lang=localStorage.koe_lang||((navigator.language||'ja').toLowerCase().startsWith('ja')?'ja':'en');
function myT(k){return (I18N[lang]&&I18N[lang][k])||I18N.ja[k]||k}
T=function(k){return myT(k)};
function applyLang(){
 document.documentElement.lang=lang;
 document.querySelectorAll('[data-i18n]').forEach(el=>el.textContent=T(el.dataset.i18n));
 document.querySelectorAll('[data-i18n-ph]').forEach(el=>el.placeholder=T(el.dataset.i18nPh));
 document.querySelectorAll('[data-i18n-opt]').forEach(el=>el.textContent=T(el.dataset.i18nOpt));
 $('langToggle').textContent=lang==='ja'?'EN':'日本語';
 if(!(rec&&rec.state==='recording'))$('recBtn').textContent=T('rec_btn');
 if($('radioBtn'))$('radioBtn').textContent=radio?T('radio_on'):T('radio_off');
}
let key=localStorage.koe_key||'';
if(location.hash.startsWith('#k=')){key=location.hash.slice(3);localStorage.koe_key=key;history.replaceState(null,'',location.pathname)}
function authHeaders(json){const h=json?{'content-type':'application/json'}:{};if(key)h.authorization='Bearer '+key;return h}
// 訪問者トークン（リアクションのactor・匿名でも安定識別）
let tkv=localStorage.tkv||'';
if(!tkv){try{tkv=Array.from(crypto.getRandomValues(new Uint8Array(12))).map(b=>b.toString(16).padStart(2,'0')).join('')}catch(e){tkv='v'+String(performance.now()).replace(/\D/g,'')}localStorage.tkv=tkv}
// 🔊 焚き火ラジオの状態
let radio=localStorage.tk_radio==='1',wake=null,seen=null,radioQ=[],radioBusy=false;

// ---- 録音 → 止めたら即くべる（デバイス的な一押し操作） ----
$('recBtn').onclick=async()=>{
 if(rec&&rec.state==='recording'){rec.stop();return}
 try{
  const stream=await navigator.mediaDevices.getUserMedia({audio:true});
  const m=pickMime();rec=new MediaRecorder(stream,m?{mimeType:m}:undefined);
  recChunks=[];recBlob=null;
  rec.ondataavailable=e=>{if(e.data.size)recChunks.push(e.data)};
  rec.onstop=()=>{
   recBlob=new Blob(recChunks,{type:rec.mimeType||'audio/webm'});
   stream.getTracks().forEach(t=>t.stop());stopTimer();
   $('recBtn').textContent=T('rec_btn');$('recBtn').classList.remove('rec-on');
   // 公開焚き火に出す前に必ずレビュー：自動投稿せずプレビュー＋確認を出す
   if(!recBlob||recBlob.size<800){$('status').textContent=T('too_short');return}
   $('preview').src=URL.createObjectURL(recBlob);$('preview').hidden=false;
   $('confirm').hidden=false;$('status').textContent=T('review');
  };
  rec.start();startTimer();$('recBtn').textContent=T('rec_stop');$('recBtn').classList.add('rec-on');
  $('confirm').hidden=true;$('preview').hidden=true;$('status').textContent='';
 }catch(e){$('status').textContent=T('mic_fail')+e.message}
};
function resetRec(){recBlob=null;$('preview').hidden=true;$('confirm').hidden=true;$('status').textContent='';$('recBtn').textContent=T('rec_btn')}
$('redoBtn').onclick=resetRec;
$('burnBtn').onclick=async()=>{
 if(!recBlob){return}
 $('burnBtn').disabled=true;$('redoBtn').disabled=true;$('status').textContent=T('burning');
 try{
  const body={audio_base64:await blobB64(recBlob),mime:recBlob.type||'audio/webm'};
  const r=await fetch(API+'/api/takibi/log',{method:'POST',headers:authHeaders(true),body:JSON.stringify(body)});
  const d=await r.json();
  if(d.ok){$('status').textContent=T('burned')+(d.text||'').slice(0,80);resetRec();setTimeout(loadFire,1200)}
  else $('status').textContent=T('fail')+(d.error||r.status);
 }catch(e){$('status').textContent=T('fail')+e.message}
 $('burnBtn').disabled=false;$('redoBtn').disabled=false;
}

// ---- 焚き火を読む／聴く ----
let playing=null;
async function loadFire(){
 try{
  const r=await fetch(API+'/api/takibi/feed',{headers:authHeaders(false)});
  const d=await r.json();
  if(!d.ok){$('feed').innerHTML=`<li class=log>${T('unreach')}${escq(d.error||'')}</li>`;return}
  const intensity=Number(d.intensity)||0;
  $('flame').textContent='· '+(lang==='ja'?'炎 ':'flame ')+(Math.round(intensity*10)/10);
  const glow=Math.min(60,12+intensity*6);
  $('fire').style.boxShadow=`0 0 ${glow}px ${Math.round(glow/2)}px #e67700${intensity>0?'66':'22'}`;
  $('postCard').hidden=!d.can_post;
  $('signinCard').hidden=!!d.can_post||!!key;
  $('logout').hidden=!key;
  const items=d.items||[];
  $('feed').innerHTML=items.length?items.map(it=>`<li class=log data-id="${escq(it.id)}">
   <div class=meta><b>${escq(it.member_name)}</b><small>${escq(it.created_at)}</small></div>
   <p class=tx>${escq(it.text.length>180?it.text.slice(0,180)+'…':it.text)}</p>
   <button class="play" data-id="${escq(it.id)}">${T('listen')}</button>
   <span class=fc data-id="${escq(it.id)}">🔥 ${it.f||0}</span>
  </li>`).join(''):`<li class=log>${T('empty')}</li>`;
  document.querySelectorAll('.play').forEach(b=>b.onclick=()=>playLog(b.dataset.id,b));
  document.querySelectorAll('.fc').forEach(s=>s.onclick=()=>react(s.dataset.id,s));
  document.querySelectorAll('#feed .log[data-id]').forEach(bindHold);
  // 🔊 自動で読む：ラジオON中に増えた新しい薪だけ順に読む（バックログは読まない＝TTS濫用防止）
  if(radio){
   if(seen===null){seen=new Set(items.map(i=>i.id))}
   else{for(let i=items.length-1;i>=0;i--){const id=items[i].id;if(!seen.has(id)){seen.add(id);radioQ.push(id)}}drainRadio()}
  }
 }catch(e){}
}
// 薪を声で再生（手動再生とラジオで共用）。btn省略時はラジオ用。
function playLog(id,btn){
 if(btn){btn.disabled=true;btn.textContent=T('converting')}
 return fetch(API+'/api/takibi/speak',{method:'POST',headers:authHeaders(true),body:JSON.stringify({id})}).then(r=>r.json()).then(d=>new Promise(res=>{
  if(!d.ok){if(btn){btn.textContent=T('listen');btn.disabled=false}return res()}
  if(playing)playing.pause();playing=new Audio(API+d.url);playing.play();
  if(btn)btn.textContent=T('playing');
  const done=()=>{if(btn){btn.textContent=T('listen');btn.disabled=false}res()};
  playing.onended=done;playing.onerror=done;
 })).catch(()=>{if(btn){btn.textContent=T('listen');btn.disabled=false}});
}
// 長押しで🔥リアクション（ボタンを増やさずジェスチャーで）
let holdT=null;
function bindHold(li){
 const id=li.dataset.id;
 const start=()=>{holdT=setTimeout(()=>{holdT=null;if(navigator.vibrate)navigator.vibrate(15);react(id,li.querySelector('.fc'))},500)};
 const cancel=()=>{if(holdT){clearTimeout(holdT);holdT=null}};
 li.addEventListener('pointerdown',start);li.addEventListener('pointerup',cancel);
 li.addEventListener('pointerleave',cancel);li.addEventListener('pointercancel',cancel);
}
async function react(id,span){
 try{const r=await fetch(API+'/api/takibi/react',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({id,r:'f',v:tkv})});
  const d=await r.json();if(d.ok&&span)span.textContent='🔥 '+d.f;}catch(e){}
}
async function drainRadio(){
 if(radioBusy||!radio||!radioQ.length)return;radioBusy=true;
 const id=radioQ.shift();await playLog(id,null);radioBusy=false;drainRadio();
}
async function setRadio(on){
 radio=on;localStorage.tk_radio=on?'1':'0';
 $('radioBtn').classList.toggle('primary',on);$('radioBtn').textContent=on?T('radio_on'):T('radio_off');
 if(on){seen=null;try{wake=await navigator.wakeLock.request('screen')}catch(e){}loadFire()}
 else{radioQ=[];if(playing)playing.pause();if(wake){wake.release().catch(()=>{});wake=null}}
}
$('radioBtn').onclick=()=>setRadio(!radio);
document.addEventListener('visibilitychange',()=>{if(radio&&document.visibilityState==='visible'&&!wake&&navigator.wakeLock){navigator.wakeLock.request('screen').then(w=>wake=w).catch(()=>{})}});
$('sendLink').onclick=async()=>{
 const em=$('email').value.trim();if(!em.includes('@'))return;
 $('signinStatus').textContent=T('link_sending');
 try{
  const r=await fetch(API+'/api/auth/request-link',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({email:em,redirect:'takibi'})});
  const d=await r.json();$('signinStatus').textContent=d.ok?T('link_sent'):T('fail')+(d.error||'');
 }catch(e){$('signinStatus').textContent=T('fail')+e.message}
};
$('logout').onclick=e=>{e.preventDefault();key='';localStorage.removeItem('koe_key');loadFire()};
// ---- 実機予約（waitlist） ----
function showCount(n){if(n>0)$('resCount').textContent='· '+n+T('res_n')}
async function loadResCount(){try{const r=await fetch(API+'/api/takibi/reserve');const d=await r.json();if(d.ok)showCount(d.count)}catch(e){}}
$('resBtn').onclick=async()=>{
 const em=$('resEmail').value.trim();
 if(!em.includes('@')){$('resStatus').textContent=T('res_bademail');return}
 $('resBtn').disabled=true;$('resStatus').textContent=T('res_sending');
 try{
  const r=await fetch(API+'/api/takibi/reserve',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({email:em,variant:$('resVariant').value})});
  const d=await r.json();
  if(d.ok){$('resStatus').textContent=T('res_ok');$('resEmail').value='';showCount(d.count)}
  else $('resStatus').textContent=T('fail')+(d.error||r.status);
 }catch(e){$('resStatus').textContent=T('fail')+e.message}
 $('resBtn').disabled=false;
};
$('langToggle').onclick=()=>{lang=lang==='ja'?'en':'ja';localStorage.koe_lang=lang;applyLang();loadFire();loadResCount()};
applyLang();loadFire();loadResCount();
setInterval(loadFire,20000);
